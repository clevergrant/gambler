<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gambler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎰 The Gambler 🎰</h1>
        <div class="balance-container">
            <p class="balance-label">Your Balance:</p>
            <p class="balance" id="balance">$100</p>
        </div>
        <button id="gambleBtn" class="gamble-btn">GAMBLE!</button>
        <div id="result" class="result"></div>
        <div class="stats">
            <p>Wins: <span id="wins">0</span></p>
            <p>Losses: <span id="losses">0</span></p>
            <p>Win Rate: <span id="winRate">0%</span></p>
        </div>
        <button id="resetBtn" class="reset-btn">Reset Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
