<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gambler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎰 The Gambler 🎰</h1>
        <div class="balance-container">
            <p class="balance-label">Your Balance:</p>
            <p class="balance" id="balance">$1.00</p>
        </div>
        <div class="bet-container">
            <label for="betAmount">Bet Amount:</label>
            <input type="number" id="betAmount" min="0.01" max="1" step="0.01" value="0.10">
        </div>
        <button id="gambleBtn" class="gamble-btn">GAMBLE!</button>
        <div id="result" class="result"></div>
        <div class="stats">
            <p>Wins: <span id="wins">0</span></p>
            <p>Losses: <span id="losses">0</span></p>
            <p>Win Rate: <span id="winRate">0%</span></p>
            <p>Total Buy-ins: <span id="buyins">1</span></p>
        </div>
        <button id="buyinBtn" class="buyin-btn" style="display: none;">Buy In Again ($1)</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
